<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrao Local Exam Teorico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Preparacao de Exame</h1>

    <section id="exam-info" class="card">
      <div>
        <span class="label">TopicO</span>
        <strong id="topic">A Carregar...</strong>
      </div>

      <div>
        <span class="label">Sub-Tópico</span>
        <strong id="subtopic">A Carregar...</strong>
      </div>

      <div>
        <span class="label">Questoes</span>
        <strong id="question-number">-</strong>
      </div>
    </section>

    <section class="card">
      <h2 id="question">A Carregar Questions...</h2>

      <div id="image-container"></div>

      <div id="answers-container"></div>

      <button id="submit-button" type="button">Confirmar escolha</button>

      <p id="result"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
