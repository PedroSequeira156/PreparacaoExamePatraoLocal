<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Exam Patrao Local</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Exam Prep</h1>

    <section id="exam-info" class="card">
      <div>
        <span class="label">Topic</span>
        <strong id="topic">Loading...</strong>
      </div>
      <div>
        <span class="label">Subtopic</span>
        <strong id="subtopic">Loading...</strong>
      </div>
      <div>
        <span class="label">Question</span>
        <strong id="question-number">-</strong>
      </div>
    </section>

    <section class="card">
      <h2 id="question">Loading questions...</h2>
      <div id="image-container"></div>
      <div id="answers-container"></div>

      <button id="submit-button">Submit Answer</button>
      <p id="result"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
